<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="archGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#1793d1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1793d1" />
      <stop offset="100%" stop-color="#33aadd" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0b0f14" />
  <rect width="1920" height="1080" fill="url(#archGlow)" />

  <!-- Arch Linux Logo Geometry -->
  <g transform="translate(960, 480)" text-anchor="middle">
    <!-- Big Arch Icon -->
    <path d="M0,-180 L120,135 L60,135 L26,45 L-26,45 L-60,135 L-120,135 Z M0,-105 L-15,8 L15,8 Z" fill="url(#archGrad)" />
    <!-- Arch Curved Silhouette base -->
    <path d="M-100,125 C-60,98 60,98 100,125 C55,110 -55,110 -100,125 Z" fill="#0b0f14" />
  </g>

  <!-- Typography -->
  <text x="960" y="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="200" fill="#ffffff" letter-spacing="14" text-anchor="middle">ARCH LINUX</text>
  <text x="960" y="750" font-family="'Consolas', 'Fira Code', monospace" font-size="20" font-weight="400" fill="#1793d1" letter-spacing="6" text-anchor="middle">SAMSUNG GALAXY &amp; WORKSTATION EDITION</text>

  <g transform="translate(960, 810)" text-anchor="middle">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="rgba(23, 147, 209, 0.12)" stroke="rgba(23, 147, 209, 0.4)" stroke-width="1.5" />
    <text y="6" font-family="'Consolas', monospace" font-size="16" fill="#a0c8e0">i use arch btw</text>
  </g>

  <!-- Bottom minimal specs -->
  <g transform="translate(960, 1020)" text-anchor="middle" font-family="'Consolas', monospace" font-size="16" fill="#4a5f78">
    <text>KERNEL 6.1 • HYPRLAND / WAYLAND • ADAPTIVE DISPLAY • SAMSUNG AMOLED &amp; PC</text>
  </g>
</svg>
