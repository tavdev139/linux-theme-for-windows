<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="1080" height="2400">
  <defs>
    <radialGradient id="archGlow" cx="50%" cy="46%" r="35%">
      <stop offset="0%" stop-color="#1793d1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1793d1" />
      <stop offset="100%" stop-color="#33aadd" />
    </linearGradient>
  </defs>

  <!-- Deep AMOLED Black background -->
  <rect width="1080" height="2400" fill="#0b0f14" />
  <rect width="1080" height="2400" fill="url(#archGlow)" />

  <!-- Arch Linux Logo Geometry -->
  <g transform="translate(540, 1050)" text-anchor="middle">
    <!-- Big Arch Icon -->
    <path d="M0,-240 L160,180 L80,180 L35,60 L-35,60 L-80,180 L-160,180 Z M0,-140 L-20,10 L20,10 Z" fill="url(#archGrad)" />
    
    <!-- Arch Curved Silhouette base -->
    <path d="M-130,165 C-80,130 80,130 130,165 C70,145 -70,145 -130,165 Z" fill="#0b0f14" />
  </g>

  <!-- Typography -->
  <text x="540" y="1350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="200" fill="#ffffff" letter-spacing="12" text-anchor="middle">ARCH LINUX</text>
  <text x="540" y="1410" font-family="'Consolas', 'Fira Code', monospace" font-size="24" font-weight="400" fill="#1793d1" letter-spacing="6" text-anchor="middle">SAMSUNG GALAXY EDITION • ROLLING</text>

  <g transform="translate(540, 1490)" text-anchor="middle">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="rgba(23, 147, 209, 0.12)" stroke="rgba(23, 147, 209, 0.4)" stroke-width="1.5" />
    <text y="7" font-family="'Consolas', monospace" font-size="20" fill="#a0c8e0">i use arch btw</text>
  </g>

  <!-- Clean minimal bottom specs -->
  <g transform="translate(540, 2240)" text-anchor="middle" font-family="'Consolas', monospace" font-size="20" fill="#4a5f78">
    <text>KERNEL 6.1.0-ARCH • HYPRLAND / WAYLAND • SAMSUNG AMOLED</text>
  </g>
</svg>
